</ol>

<div id="barra-filtros-lista" class="card shadow-sm mb-3">
	<div class="card-body py-3">
		<div class="row g-2 align-items-end">
			<div class="col-md-4">
				<label class="form-label small mb-1" for="filtro-busca-cert">Aluno</label>
				<input type="search" class="form-control form-control-sm" name="busca" id="filtro-busca-cert" placeholder="Nome, e-mail ou WhatsApp do aluno…">
			</div>
			<div class="col-md-3">
				<label class="form-label small mb-1" for="filtro_impresso">Impresso</label>
				<select class="form-control form-control-sm" name="filtro_impresso" id="filtro_impresso">
					<option value="">Todos</option>
					<option value="1">Sim (já impresso)</option>
					<option value="0">Não (pendente impressão)</option>
				</select>
			</div>
			<div class="col-md-3">
				<label class="form-label small mb-1" for="filtro_retirada">Retirada</label>
				<select class="form-control form-control-sm" name="filtro_retirada" id="filtro_retirada">
					<option value="">Todos</option>
					<option value="retirado">Já retirados</option>
					<option value="pendente">Pendente retirada</option>
				</select>
			</div>
			<div class="col-md-2 d-flex flex-wrap gap-2">
				<button type="button" class="btn btn-sm btn-outline-secondary btn-limpar-filtros">Limpar</button>
				<button type="button" class="btn btn-sm btn-success ms-auto" onclick="list_itens('','novo')">Nova certificação</button>
			</div>
		</div>
	</div>
</div>

<div class="card shadow-sm mb-4">
	<div class="card-body p-0">
		<div id="listar" class="p-3 text-muted small">Carregando…</div>
		<nav class="px-3 pb-3" aria-label="Paginação">
			<ul class="pagination pagination-sm mb-0" id="pagination"></ul>
		</nav>
	</div>
</div>

<div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog">

</div>
