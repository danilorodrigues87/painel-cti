<h1 class="mt-4">Cadastrar candidato</h1>
<ol class="breadcrumb mb-4">
  <li class="breadcrumb-item"><a href="{{URL}}/painel/conect">Conecta Jovem</a></li>
  <li class="breadcrumb-item active">Novo candidato</li>
</ol>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <form method="post" action="{{save_url}}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nome *</label>
          <input type="text" name="nome" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">WhatsApp</label>
          <input type="text" name="whatsapp" class="form-control" placeholder="11999999999">
        </div>
        <div class="col-md-6">
          <label class="form-label">E-mail (opcional — cria acesso ao portal)</label>
          <input type="email" name="email" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Resumo / objetivo</label>
          <textarea name="resumo" class="form-control" rows="3"></textarea>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar candidato</button>
        <a href="{{URL}}/painel/conect" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
