<h1 class="mt-4">Conecta Jovem</h1>
<p class="text-muted">Moderação do portal de empregabilidade — empresas e vagas parceiras.</p>

<div class="card border-0 shadow-sm mb-4">
  <div class="card-header bg-white"><strong>Empresas pendentes</strong></div>
  <div class="table-responsive">
    <table class="table table-sm mb-0">
      <thead><tr><th>Empresa</th><th>CNPJ</th><th>E-mail</th><th></th></tr></thead>
      <tbody>{{rows_empresas}}</tbody>
    </table>
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-header bg-white"><strong>Vagas pendentes</strong></div>
  <div class="table-responsive">
    <table class="table table-sm mb-0">
      <thead><tr><th>Vaga</th><th>Empresa</th><th>Tipo</th><th></th></tr></thead>
      <tbody>{{rows_vagas}}</tbody>
    </table>
  </div>
</div>

<p class="small text-muted mt-3">Portal: <a href="https://conectjovem.com.br" target="_blank" rel="noopener">conectjovem.com.br</a></p>
